<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="620" xmlns="http://www.w3.org/2000/svg">
<rect width="100%" height="100%" fill="white"/>
<text x="700" y="30" text-anchor="middle" font-size="20" font-weight="bold" font-family="Arial">Comparacion de tiempos</text>
<text x="700" y="52" text-anchor="middle" font-size="14" font-family="Arial">loro.jpg (azul) vs etn.jpg (naranja)</text>
<line x1="80" y1="70" x2="80" y2="520" stroke="black"/>
<line x1="80" y1="520" x2="1020" y2="520" stroke="#eee"/>
<text x="72" y="524" text-anchor="end" font-size="12" font-family="Arial">0</text>
<line x1="80" y1="430" x2="1020" y2="430" stroke="#eee"/>
<text x="72" y="434" text-anchor="end" font-size="12" font-family="Arial">10</text>
<line x1="80" y1="340" x2="1020" y2="340" stroke="#eee"/>
<text x="72" y="344" text-anchor="end" font-size="12" font-family="Arial">20</text>
<line x1="80" y1="250" x2="1020" y2="250" stroke="#eee"/>
<text x="72" y="254" text-anchor="end" font-size="12" font-family="Arial">30</text>
<line x1="80" y1="160" x2="1020" y2="160" stroke="#eee"/>
<text x="72" y="164" text-anchor="end" font-size="12" font-family="Arial">40</text>
<line x1="80" y1="70" x2="1020" y2="70" stroke="#eee"/>
<text x="72" y="74" text-anchor="end" font-size="12" font-family="Arial">50</text>
<rect x="95" y="124" width="44" height="396" fill="#3498db" stroke="black"/>
<text x="117" y="120" text-anchor="middle" font-size="10" font-family="Arial">44</text>
<rect x="145" y="79" width="44" height="441" fill="#e67e22" stroke="black"/>
<text x="167" y="75" text-anchor="middle" font-size="10" font-family="Arial">49</text>
<text x="139" y="555" text-anchor="end" font-size="11" font-family="Arial" transform="rotate(-40 139 555)">Secuencial</text>
<rect x="229" y="304" width="44" height="216" fill="#3498db" stroke="black"/>
<text x="251" y="300" text-anchor="middle" font-size="10" font-family="Arial">24</text>
<rect x="279" y="241" width="44" height="279" fill="#e67e22" stroke="black"/>
<text x="301" y="237" text-anchor="middle" font-size="10" font-family="Arial">31</text>
<text x="273" y="555" text-anchor="end" font-size="11" font-family="Arial" transform="rotate(-40 273 555)">OpenMP 1</text>
<rect x="363" y="404" width="44" height="116" fill="#3498db" stroke="black"/>
<text x="385" y="400" text-anchor="middle" font-size="10" font-family="Arial">13</text>
<rect x="413" y="385" width="44" height="135" fill="#e67e22" stroke="black"/>
<text x="435" y="381" text-anchor="middle" font-size="10" font-family="Arial">15</text>
<text x="407" y="555" text-anchor="end" font-size="11" font-family="Arial" transform="rotate(-40 407 555)">OpenMP 2</text>
<rect x="497" y="466" width="44" height="54" fill="#3498db" stroke="black"/>
<text x="519" y="462" text-anchor="middle" font-size="10" font-family="Arial">6</text>
<rect x="547" y="404" width="44" height="116" fill="#e67e22" stroke="black"/>
<text x="569" y="400" text-anchor="middle" font-size="10" font-family="Arial">13</text>
<text x="541" y="555" text-anchor="end" font-size="11" font-family="Arial" transform="rotate(-40 541 555)">OpenMP 4</text>
<rect x="631" y="457" width="44" height="63" fill="#3498db" stroke="black"/>
<text x="653" y="453" text-anchor="middle" font-size="10" font-family="Arial">7</text>
<rect x="681" y="412" width="44" height="108" fill="#e67e22" stroke="black"/>
<text x="703" y="408" text-anchor="middle" font-size="10" font-family="Arial">12</text>
<text x="675" y="555" text-anchor="end" font-size="11" font-family="Arial" transform="rotate(-40 675 555)">OpenMP 8</text>
<rect x="765" y="448" width="44" height="72" fill="#3498db" stroke="black"/>
<text x="787" y="444" text-anchor="middle" font-size="10" font-family="Arial">8</text>
<rect x="815" y="430" width="44" height="90" fill="#e67e22" stroke="black"/>
<text x="837" y="426" text-anchor="middle" font-size="10" font-family="Arial">10</text>
<text x="809" y="555" text-anchor="end" font-size="11" font-family="Arial" transform="rotate(-40 809 555)">MPI 4</text>
<rect x="899" y="421" width="44" height="99" fill="#3498db" stroke="black"/>
<text x="921" y="417" text-anchor="middle" font-size="10" font-family="Arial">11</text>
<rect x="949" y="404" width="44" height="116" fill="#e67e22" stroke="black"/>
<text x="971" y="400" text-anchor="middle" font-size="10" font-family="Arial">13</text>
<text x="943" y="555" text-anchor="end" font-size="11" font-family="Arial" transform="rotate(-40 943 555)">Hibrida</text>
<rect x="1040" y="70" width="345" height="450" fill="#f0f7ff" stroke="#3498db" stroke-width="1.5" rx="8"/>
<text x="1055" y="95" font-size="14" font-family="Arial" fill="#1a5276" font-weight="bold">Que se esta comparando:</text>
<text x="1055" y="120" font-size="11" font-family="Arial" fill="#2c3e50">Tiempo de ejecucion (ms)</text>
<text x="1055" y="138" font-size="11" font-family="Arial" fill="#2c3e50">del filtro Cartoon bajo las</text>
<text x="1055" y="156" font-size="11" font-family="Arial" fill="#2c3e50">mismas condiciones de prueba.</text>
<text x="1055" y="184" font-size="11" font-family="Arial" fill="#2c3e50" font-weight="bold">Se toma el mejor tiempo de</text>
<text x="1055" y="200" font-size="11" font-family="Arial" fill="#2c3e50">cada version (filtro=3, niveles=3):</text>
<text x="1055" y="224" font-size="11" font-family="Arial" fill="#2c3e50">• Secuencial: 1 nucleo</text>
<text x="1055" y="240" font-size="11" font-family="Arial" fill="#2c3e50">• OpenMP: 1/2/4/8 threads</text>
<text x="1055" y="256" font-size="11" font-family="Arial" fill="#2c3e50">• MPI 4: 4 procesos</text>
<text x="1055" y="272" font-size="11" font-family="Arial" fill="#2c3e50">• Hibrida: MPI + OpenMP</text>
<text x="1055" y="300" font-size="11" font-family="Arial" fill="#2c3e50" font-weight="bold">Leyenda:</text>
<rect x="1055" y="308" width="14" height="14" fill="#3498db"/>
<text x="1075" y="320" font-size="11" font-family="Arial" fill="#2c3e50">loro.jpg</text>
<rect x="1055" y="328" width="14" height="14" fill="#e67e22"/>
<text x="1075" y="340" font-size="11" font-family="Arial" fill="#2c3e50">etn.jpg</text>
<text x="1055" y="370" font-size="10" font-family="Arial" fill="#566573" font-style="italic">Objetivo: ver cual version</text>
<text x="1055" y="384" font-size="10" font-family="Arial" fill="#566573" font-style="italic">termina mas rapido y como</text>
<text x="1055" y="398" font-size="10" font-family="Arial" fill="#566573" font-style="italic">escala al aumentar threads.</text>
</svg>
